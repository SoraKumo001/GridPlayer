name: .NET Core Desktop

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022 
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore grid-video-player/grid-video-player.csproj

    - name: Build and Publish
      run: |
        dotnet publish grid-video-player/grid-video-player.csproj -c Release -r win-x64 --self-contained false -o publish_output

    - name: Create Zip Archive
      run: Compress-Archive -Path publish_output/* -DestinationPath GridVideoPlayer.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: GridVideoPlayer.zip
        draft: false
        prerelease: false
